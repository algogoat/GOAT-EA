name: Controller Windows tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: controller-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Job layout (goatai#1885). One job used to run everything and hit the 60-minute job limit: the
# mutation checks alone took ~56 min, so the full unittest step was cut off and runs ended
# `cancelled`, even on the base branch. Every check below runs exactly as before; only the job that
# holds it changed. A multi-line step only fails on its last exit code, so the two former
# two-command steps (Steady Studio panel, Terminal isolation mutations) are now one command per step.
#
# controller (check name "controller", unchanged)
#   setup + native import check, every non-mutation node fixture, and
#   python -m unittest discover -s controller -p "test_*.py"
#     node: test_studio_setting_compare, test_studio_control_feedback, test_studio_agent_export_display,
#           test_batch_cancel_origin, test_optimization_axis_isolation, test_research_outcome,
#           test_connection_code, test_activation_code_file, test_broker_facts_payload,
#           test_bias_reader_parity, test_agent_connection_layout, test_studio_steady_panel,
#           test_dashboard_overview, test_ea_followups, test_studio_derived_report,
#           test_terminal_isolation, test_profile_staged_adoption, test_b49a_no_drift, test_b49b_no_drift,
#           test_ticket_width,
#           test_ledger_join, test_restart_adopt,
#           test_b50_no_drift, test_b50_parity, test_b50_single, test_b50_clock,
#           test_b50_exits, test_b50_integration,
#           test_b51_no_drift, test_b54_no_drift, test_b51_parity, test_b51_random, test_b51_modify,
#           test_b51_partial,
#           test_b49b_f7, test_b49b_f5, test_b49b_f3,
#           test_b49b_f3b, test_b49b_f6, test_b49b_f4, test_b49b_lag, test_b49b_f8,
#           test_b49b_f1, test_b52_review, test_hunt_sets_init, test_b54_gate0, test_b54_init,
#           test_portfolio_child_audit, test_portfolio_child_binding, test_dashboard_deploy_paths,
#           test_profile_writer_goldens, test_child_magic_unique, test_ai_wire_retry, test_child_snapshot_stream,
#           test_ai_gate_log, test_blind_export, test_trace_marks_downsample, test_license_init_retry,
#           test_panel_headless, test_alert_guard, test_cid_guard
#     python: test_goat_deployment_liveness
#
# b49b lag mutations (N/4)    test_b49b_lag_mutations, every 4th mutant from the Nth (GOAT-EA#290: the whole suite took
#                             the controller job past its cap).
#
# node mutations (<suite>)  every node mutation suite the controller job ran (B50, B51, B49a and B49b), plus
#                             test_b52_review_mutations, one parallel job each (B52: both lines' suites took the combined
#                             controller job past its 70-minute cap).
#
# mutation-suites             one aggregate of node mutations and b49b lag mutations: it fails unless every leg of both
#                             succeeded (the second read of B52, P2-3: no gated check depended on them).
#
# Controller mutations (GOAT-EA#204; Claude-Mac, goatai#2350 6089452823 + 6089458580). With 3 shards,
# shard 1/3 hit the 45-min cap on GOAT-EA#201 and #203 (run 37956413084: 45.25 min, cancelled), so the
# suite now runs as 4 shards split by measured step time. The step table and the timing data live
# in controller-mutation-shard.yml (one reusable workflow, also used by the full run).
# B47 (goatai#2350 6186991728): each shard's cap is 60 min, and the slow steps log a per-mutant time
# budget; the measured step table and why the shards were not split again are in that file.
#
#   mutation selection        scripts/ci_mutation_select.py diffs the PR against its merge base and
#                             picks the steps whose files it changes plus their dependents. Core
#                             files (CI wiring, the selector, requirements, shared controller
#                             modules), deletions and any file it cannot map run the FULL suite.
#   mutation shard (N/4)      the 4 shards; a shard with no selected step is skipped, and a step the
#                             PR does not affect is skipped (each shard's log lists RUN / SKIP).
#   controller-mutations (1/3)  aggregates shards 1/4 and 2/4   } the three check names branch
#   controller-mutations (2/3)  aggregates shard 3/4            } protection requires, unchanged.
#   controller-mutations (3/3)  aggregates shard 4/4            } Each fails unless the selection
#                             succeeded and every shard it aggregates either succeeded or was
#                             deliberately skipped by the selection.
#
# The full suite runs on every push to codex/v148-research-planning (controller-mutations-full.yml),
# which records its result per commit; Release's candidate build refuses a sha without a green one.
# controller/test_ci_mutation_shards.py checks the shards, the aggregation and the selection rules.

jobs:
  controller:
    runs-on: windows-2022
    # Setup, fast fixtures and the full unittest suite: ~8-10 min (unittest alone 7 min on a slow runner).
    # B49b: its in-job mutation suites (F7, then F5 and F3) took a 27-min job past 30 (GOAT-EA#270 run 40462891356 was
    # cancelled in the unittest step), so the job had 45. B49b tidy (GOAT-EA#285): on the slower runners of 10-29 the steps
    # before the F1 mutations took 27-29 min (18 on #284's run), the F1 mutations ran past the cap (run 40805681829), and the
    # full unittest suite after them takes ~12 min, so the job has 70. The cap only stops a runaway: a normal run bills its
    # actual minutes.
    timeout-minutes: 70
    env:
      PYTHONUTF8: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:1
    steps:
      - name: Check out proposed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # B49a: test_b49a_no_drift, test_ticket_width and test_ledger_join read B47's source (ccb0a07) from history.
          # B50: test_b49a_no_drift, test_b50_no_drift and test_b50_parity read B49a's source (65fde12) from history.
          # B51: test_b50_no_drift, test_b51_no_drift, test_b51_parity and test_b51_random read B50-alpha's (32df4eb).
          # B49b: test_b49b_no_drift reads B49a's (693cad0) and, on the merged line, B49b's own tree (claude-pc/b49b 808ff728) from history.
          # B54: test_b54_gate0 (.cjs and .py) reads B53's source and controller package (216e1622) from history.
          fetch-depth: 0

      - name: Set up Windows x64 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Install only the publisher's hash-pinned native wheels
        run: |
          python -m pip install --no-index --no-deps --only-binary=:all: --require-hashes -r controller/ci-requirements.txt

      - name: Verify native imports without connecting to MT5
        shell: python
        env:
          # Hosted Windows TEMP defaults to a short-name alias; require canonical fixtures.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          import sys
          import tempfile
          from pathlib import Path
          import numpy
          import MetaTrader5
          assert sys.platform == "win32" and sys.version_info[:2] == (3, 13)
          fixture_temp = Path(tempfile.gettempdir())
          assert fixture_temp.is_absolute() and fixture_temp.resolve() == fixture_temp
          print("Canonical fixture temp", fixture_temp)
          assert numpy.__version__ == "2.2.6"
          assert MetaTrader5.__version__ == "5.0.6180"
          assert numpy.dot(numpy.array([2, 3]), numpy.array([4, 5])).item() == 23
          print(sys.version)
          print("Verified NumPy", numpy.__version__, "and MetaTrader5", MetaTrader5.__version__)

      - name: Verify semantic tester settings round-trip fixtures
        run: node scripts/test_studio_setting_compare.cjs

      - name: Verify Studio control feedback state transitions
        run: node scripts/test_studio_control_feedback.cjs
      - name: Verify agent committed export display and retained human draft
        run: node scripts/test_studio_agent_export_display.cjs
      - name: Native batch cancellation origin
        run: node scripts/test_batch_cancel_origin.cjs
      - name: Native optimization axis isolation and pre-start readback
        run: node scripts/test_optimization_axis_isolation.cjs
      # One command per step: a multi-line pwsh step only fails on its last exit code.
      - name: Research outcomes (no profitable passes, no qualifying rows)
        run: node scripts/test_research_outcome.cjs
      - name: Connection code prompt and fragment link
        run: node scripts/test_connection_code.cjs
      - name: The EA shares its pending connection code locally (LC36 activation-code file)
        run: node scripts/test_activation_code_file.cjs
      - name: Broker facts on device/start and the license check (zero-click demo pairing, goatai#1885)
        run: node scripts/test_broker_facts_payload.cjs
      - name: Recorded AI bias reaches the bias logic as live does, at every Bias_threshold (goatai#1885)
        run: node scripts/test_bias_reader_parity.cjs
      - name: Agent connection compact and full layout
        run: node scripts/test_agent_connection_layout.cjs
      - name: Steady Studio panel (one paint per refresh)
        run: node scripts/test_studio_steady_panel.cjs
      - name: Dashboard overview presentation
        run: node scripts/test_dashboard_overview.cjs
      - name: Profile-staged deploy adoption, link_children, retired deploy_next and disabled dashboard deploy (beta.25, goatai#1885)
        run: node scripts/test_profile_staged_adoption.cjs
      - name: B49a no drift from B47 (B49a's own commit 65fde12; every changed line marked; inputs append-only)
        run: node scripts/test_b49a_no_drift.cjs
      - name: B50 no drift from B49a (every changed line marked; contract follows the tree; inputs append-only, TF_D1 allowance)
        run: node scripts/test_b50_no_drift.cjs
      - name: B50 flags-off parity with B49a (converted OnTick region on the same fixtures; WriteSet golden)
        run: node scripts/test_b50_parity.cjs
      - name: B50 single core (Engine_Single on the converted OnTick path; risk lots, one position per signal episode)
        run: node scripts/test_b50_single.cjs
      # The node mutation suites run in their own job (node-mutations, below), each in parallel.
      - name: B50 New York clock (DST 2007-2035, server-clock models, NY session through the real tick, rollover, live self-check; mutants)
        run: node scripts/test_b50_clock.cjs
      - name: B50 single exits (opposite signal, time stop, the FastSpeed bypass for every single)
        run: node scripts/test_b50_exits.cjs
      - name: B50 integration (the clock's entry block holds for singles; a full New York week of entries, exits and the Friday cutoff; mutants)
        run: node scripts/test_b50_integration.cjs
      - name: B51 no drift from B50-alpha (every changed line marked; contract follows the tree; inputs append-only, B50-beta allowance)
        run: node scripts/test_b51_no_drift.cjs
      - name: B54 no drift from B53 (every changed line marked; contract follows the tree; inputs append-only, the 14 breakout inputs at the end)
        run: node scripts/test_b54_no_drift.cjs
      - name: B51 flags-off parity with B50-alpha (converted OnTick region, grid and single fixtures; WriteSet golden)
        run: node scripts/test_b51_parity.cjs
      - name: B51 random-direction benchmark (splitmix64 of seed and signal-bar time; same timing, gates, sizing and exits; flags off = B50-alpha)
        run: node scripts/test_b51_random.cjs
      - name: B51 single break-even and trailing (entry ATR, legal clamp, only in favour; modify failure log and back-off per ticket; restart)
        run: node scripts/test_b51_modify.cjs
      - name: B51 single partial close and the demo gate (legal volumes, once per position across restarts, refused closes; real accounts refused, also when the mode cannot be read)
        run: node scripts/test_b51_partial.cjs
      - name: B49b no drift from B49a (every changed line marked; contract follows the tree; inputs append-only)
        run: node scripts/test_b49b_no_drift.cjs
      - name: B49a 64-bit tickets (no int holds a ticket; tickets above INT_MAX replayed; B47 caught)
        run: node scripts/test_ticket_width.cjs
      - name: B49a F2 Ledger_Mode (exits join by position; Legacy reproduces B47; MT5 history-selection rules)
        run: node scripts/test_ledger_join.cjs
      - name: B49a F1-lite restart adoption (manage-only, the restart record, matched and unmatched baskets)
        run: node scripts/test_restart_adopt.cjs
      - name: B49b F7 money and volume units, indicator handles and buffers (B49a compared)
        run: node scripts/test_b49b_f7.cjs
      - name: B49b F5 Gate_Recheck (every start gate at the first real order; EX-11)
        run: node scripts/test_b49b_f5.cjs
      - name: B49b F3 Fix_ClosePath (an end waits for flat; failed closes and modifies logged)
        run: node scripts/test_b49b_f3.cjs
      - name: B49b F3b dashboard (a failed child close is retried; a risk breach is followed until flat)
        run: node scripts/test_b49b_f3b.cjs
      - name: B49b F6 pre-trade caps (Max_Spread_Points replaces MaxSP; Min_Margin_Level_PC floor)
        run: node scripts/test_b49b_f6.cjs
      - name: B49b F4 exits without a tick (live-only timer) and Fix_Clock (full-timestamp IsNew*)
        run: node scripts/test_b49b_f4.cjs
      - name: B49b lag hotfix (flags off is the base; the feed guard, server-time ends, the owed Friday close; read-only timing; bounded per-tick load)
        run: node scripts/test_b49b_lag.cjs
      # The lag hotfix mutations run in their own job (b49b-lag-mutations, below).
      - name: B49b F8 export integrity (trim, mismatched rows, window P/L, CSV final row, tester wait, format stamp)
        run: node scripts/test_b49b_f8.cjs
      - name: B49b F1 full (manage-only on a licence outage, refusal or expiry; the state file; the day state)
        run: node scripts/test_b49b_f1.cjs
      - name: B52 the final build's review fixes (a deferred adoption keeps its state and is held; a held single stays armed; no benchmark under the first-order gate)
        run: node scripts/test_b52_review.cjs
      - name: D1 hunt SETs init on the merged OnInit (the 11 preregistered design SETs, at their values and each optimized axis's start and stop)
        run: node scripts/test_hunt_sets_init.cjs
      # B54 gate 0's controller half (contracts, pinned inputs, explicit lines, validate_strategy) is controller/test_b54_gate0.py,
      # which the unittest step below discovers.
      - name: B54 gate 0 (the 61 pool SETs on B53 and this tree; no new input named, the same OnInit and input globals, the new inputs at their defaults, WriteSet's bytes; mutants)
        run: node scripts/test_b54_gate0.cjs
      - name: B54 OnInit refusals (spec 4.6; the synthetic axis SETs at each probe as axes.json names, the mode values without a signal term refused in the tester and live, the chart, live and test-start rules; mutants)
        run: node scripts/test_b54_init.cjs
      - name: Deploy settingsMatch audit, CA41 exemptions
        run: node scripts/test_portfolio_child_audit.cjs
      - name: Child adoption binding and link freshness
        run: node scripts/test_portfolio_child_binding.cjs
      - name: Dashboard paths and retired template deploy path
        run: node scripts/test_dashboard_deploy_paths.cjs
      - name: B44 MQL deploy-profile writer is byte-equal to studio_deploy_profile (G2, G4 goldens)
        run: node scripts/test_profile_writer_goldens.cjs
      - name: Child adoption liveness source guards
        run: python scripts/test_goat_deployment_liveness.py
      - name: FU35 cancel stop confirmation and EvidenceEnd export boundary
        run: node scripts/test_ea_followups.cjs
      - name: B44 child magic unique by construction, B45 per-terminal salt (Exp 03 2026-10-12, goatai#2350, GOAT-EA#227)
        run: node scripts/test_child_magic_unique.cjs
      - name: B44 AI wire fast retry after a failed or unverified fetch (2026-10-12, goatai#2350)
        run: node scripts/test_ai_wire_retry.cjs
      - name: B44 child snapshot audit streams the template and adoption names its refusals (goatai#2350)
        run: node scripts/test_child_snapshot_stream.cjs
      - name: B44 AI gate log line, Print only, trading unchanged (goatai#2350)
        run: node scripts/test_ai_gate_log.cjs
      - name: B44 BlindExport ranks exports on fit+FWD, B45 parity with studio_window_metrics, BOOS-free, non-FOOS sizing; blind=0 unchanged (goatai#2350, GOAT-EA#227)
        run: node scripts/test_blind_export.cjs
      - name: B44 sequence capture marks go coarser past 1M rows, no 2M stop (goatai#2350)
        run: node scripts/test_trace_marks_downsample.cjs
      - name: Licence check retries a 5xx or WebRequest failure at init, V1.47 and V1.49 (B44 item 7)
        run: node scripts/test_license_init_retry.cjs
      - name: B44 panel retry, headless child, no modal Alert in deploy mode (goatai#2350)
        run: node scripts/test_panel_headless.cjs
      - name: B44 every Alert( in the compile closure is inside the deploy-notice redirection (include order)
        run: node scripts/test_alert_guard.cjs
      - name: B46/B47 CID guard (orphan_suspected, cid_duplicate; live-chart mappings, claim heartbeat, unreadable claim, add freeze), management continues (goatai#2350)
        run: node scripts/test_cid_guard.cjs
      # One command per step (GOAT-EA#227 review): this was one two-command step, which only failed on its last exit
      # code, so a failing test_lint_ea_mailbox_share.py was hidden by a passing lint run.
      - name: EA-MAILBOX-SHARE-01 lint self-test (B44 item 11, goatai#2350 6127147178)
        run: python scripts/test_lint_ea_mailbox_share.py
      - name: EA-MAILBOX-SHARE-01 mailbox reads are FILE_SHARE_READ (B44 item 11, goatai#2350 6127147178)
        run: python scripts/lint_ea_mailbox_share.py

      - name: Verify Studio derived Report handoff safety
        run: node scripts/test_studio_derived_report.cjs
      - name: Terminal isolation (per-terminal batch state, per-login credential)
        run: node scripts/test_terminal_isolation.cjs

      - name: Run every controller fixture test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -m unittest discover -s controller -p "test_*.py" -v

  # B49b lag hotfix mutations (GOAT-EA#290). 186 mutants, each a full run of test_b49b_lag.cjs (97 s on a hosted runner),
  # took the controller job past its 70-minute cap (run 42346124149: the step ran 33 min and was cancelled with the F8 and
  # F1 steps and the unittest suite still to come). They run here instead, as 4 parallel shards: every 4th mutant from the
  # Nth (GOAT_MUTATION_SHARD=N/4), about 47 mutants and 20 min each. Every mutant still runs on every PR.
  b49b-lag-mutations:
    name: b49b lag mutations (${{ matrix.shard }}/4)
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out proposed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # test_b49b_lag compares against be341e5 from history.
          fetch-depth: 0

      - name: B49b lag hotfix mutations
        env:
          GOAT_MUTATION_SHARD: ${{ matrix.shard }}/4
        run: node scripts/test_b49b_lag_mutations.cjs

  # B52 (the final build): both lines' in-job node mutation suites took the combined controller job past its 70-minute
  # cap (B51 random 19.7 min, partial 10.8, B49b F7 15.7, F1-lite up to 11.8, with the 16-minute unittest suite still in
  # the job). They run here, one matrix entry per suite, in parallel; every suite still runs on every PR.
  node-mutations:
    name: node mutations (${{ matrix.suite }})
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite:
          - test_b50_single_mutations.cjs
          - test_b50_exits_mutations.cjs
          - test_b51_random_mutations.cjs
          - test_b51_modify_mutations.cjs
          - test_b51_partial_mutations.cjs
          - test_ledger_join_mutations.cjs
          - test_restart_adopt_mutations.cjs
          - test_b49b_f7_mutations.cjs
          - test_b49b_f5_mutations.cjs
          - test_b49b_f3_mutations.cjs
          - test_b49b_f3b_mutations.cjs
          - test_b49b_f6_mutations.cjs
          - test_b49b_f4_mutations.cjs
          - test_b49b_f8_mutations.cjs
          - test_b49b_f1_mutations.cjs
          - test_b52_review_mutations.cjs
    steps:
      - name: Check out proposed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # B49a/B49b/B50/B51 guards and tests read earlier commits from history.
          fetch-depth: 0

      - name: Node mutation suite
        run: node scripts/${{ matrix.suite }}

  # The second read of B52 (P2-3): no check the merge gate stops on depended on the two matrices above. One aggregate under
  # one stable name fails unless every leg of both succeeded (a matrix's result is its legs' aggregate). It always runs, so
  # it is never "skipping", and ops-merge-ea-pr.ps1 refuses every check outside pass and skipping, this one included.
  mutation-suites:
    name: mutation-suites
    needs: [node-mutations, b49b-lag-mutations]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every node mutation suite and every B49b lag mutation shard succeeded
        env:
          NODE_MUTATIONS: ${{ needs.node-mutations.result }}
          B49B_LAG_MUTATIONS: ${{ needs.b49b-lag-mutations.result }}
        run: echo "node-mutations=$NODE_MUTATIONS b49b-lag-mutations=$B49B_LAG_MUTATIONS"; test "$NODE_MUTATIONS" = success && test "$B49B_LAG_MUTATIONS" = success

  mutation-selection:
    name: mutation selection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      run_1: ${{ steps.select.outputs.run_1 }}
      steps_1: ${{ steps.select.outputs.steps_1 }}
      run_2: ${{ steps.select.outputs.run_2 }}
      steps_2: ${{ steps.select.outputs.steps_2 }}
      run_3: ${{ steps.select.outputs.run_3 }}
      steps_3: ${{ steps.select.outputs.steps_3 }}
      run_4: ${{ steps.select.outputs.run_4 }}
      steps_4: ${{ steps.select.outputs.steps_4 }}
    steps:
      - name: Check out proposed source with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Full commit history for the merge base, without every historical blob (~260 MB packed).
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Select the mutation steps this pull request needs
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/ci_mutation_select.py select --event "$EVENT" --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  mutation-shard-1:
    name: mutation shard (1/4)
    needs: mutation-selection
    if: needs.mutation-selection.outputs.run_1 == 'true'
    uses: ./.github/workflows/controller-mutation-shard.yml
    with:
      shard: 1
      steps: ${{ needs.mutation-selection.outputs.steps_1 }}

  mutation-shard-2:
    name: mutation shard (2/4)
    needs: mutation-selection
    if: needs.mutation-selection.outputs.run_2 == 'true'
    uses: ./.github/workflows/controller-mutation-shard.yml
    with:
      shard: 2
      steps: ${{ needs.mutation-selection.outputs.steps_2 }}

  mutation-shard-3:
    name: mutation shard (3/4)
    needs: mutation-selection
    if: needs.mutation-selection.outputs.run_3 == 'true'
    uses: ./.github/workflows/controller-mutation-shard.yml
    with:
      shard: 3
      steps: ${{ needs.mutation-selection.outputs.steps_3 }}

  mutation-shard-4:
    name: mutation shard (4/4)
    needs: mutation-selection
    if: needs.mutation-selection.outputs.run_4 == 'true'
    uses: ./.github/workflows/controller-mutation-shard.yml
    with:
      shard: 4
      steps: ${{ needs.mutation-selection.outputs.steps_4 }}

  # The three checks branch protection requires, names unchanged (Claude-Mac, goatai#2350 6089452823).
  # Each fails unless the selection succeeded and each of its shards succeeded, or was skipped because
  # the selection chose to skip it (run_N == 'false'); scripts/ci_mutation_select.py verdict decides.
  controller-mutations-1:
    name: controller-mutations (1/3)
    needs: [mutation-selection, mutation-shard-1, mutation-shard-2]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the verdict script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci_mutation_select.py
          sparse-checkout-cone-mode: false
      - name: Shards 1/4 and 2/4 succeeded or were deliberately skipped
        env:
          SELECTION: ${{ needs.mutation-selection.result }}
          SHARD_1: 1:${{ needs.mutation-selection.outputs.run_1 }}:${{ needs.mutation-shard-1.result }}
          SHARD_2: 2:${{ needs.mutation-selection.outputs.run_2 }}:${{ needs.mutation-shard-2.result }}
        run: python3 scripts/ci_mutation_select.py verdict --selection "$SELECTION" --shard "$SHARD_1" --shard "$SHARD_2"

  controller-mutations-2:
    name: controller-mutations (2/3)
    needs: [mutation-selection, mutation-shard-3]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the verdict script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci_mutation_select.py
          sparse-checkout-cone-mode: false
      - name: Shard 3/4 succeeded or was deliberately skipped
        env:
          SELECTION: ${{ needs.mutation-selection.result }}
          SHARD_3: 3:${{ needs.mutation-selection.outputs.run_3 }}:${{ needs.mutation-shard-3.result }}
        run: python3 scripts/ci_mutation_select.py verdict --selection "$SELECTION" --shard "$SHARD_3"

  controller-mutations-3:
    name: controller-mutations (3/3)
    needs: [mutation-selection, mutation-shard-4]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the verdict script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci_mutation_select.py
          sparse-checkout-cone-mode: false
      - name: Shard 4/4 succeeded or was deliberately skipped
        env:
          SELECTION: ${{ needs.mutation-selection.result }}
          SHARD_4: 4:${{ needs.mutation-selection.outputs.run_4 }}:${{ needs.mutation-shard-4.result }}
        run: python3 scripts/ci_mutation_select.py verdict --selection "$SELECTION" --shard "$SHARD_4"
